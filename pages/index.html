<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cloudflare Workers APIの動作確認用ページ">
    <title>Senka API Console</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172127;
            --muted: #637078;
            --line: #d8e0dc;
            --paper: #f7faf6;
            --panel: #ffffff;
            --accent: #d85f38;
            --accent-dark: #a84025;
            --mint: #dcece4;
            --shadow: 0 18px 50px rgb(32 55 43 / 10%);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-width: 320px;
            color: var(--ink);
            background:
                radial-gradient(circle at 85% 8%, #f5d6b5 0 7%, transparent 28%),
                linear-gradient(145deg, #f7faf6 0%, #edf5ef 48%, #f9f1e8 100%);
            font-family: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
        }

        main { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 72px; }
        header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 34px; }
        .eyebrow { margin: 0 0 10px; color: var(--accent-dark); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 0; text-transform: uppercase; }
        h1 { max-width: 610px; margin: 0; font-size: clamp(38px, 7vw, 72px); font-weight: 500; line-height: .98; letter-spacing: 0; }
        .intro { max-width: 270px; margin: 0; color: var(--muted); font: 15px/1.7 Arial, sans-serif; }
        .toolbar, section { background: rgb(255 255 255 / 82%); border: 1px solid rgb(216 224 220 / 90%); box-shadow: var(--shadow); }
        .toolbar { display: flex; gap: 12px; align-items: center; padding: 14px; margin-bottom: 24px; }
        label { color: var(--muted); font: 700 12px/1.2 Arial, sans-serif; white-space: nowrap; }
        input { width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: #fff; font: 14px Arial, sans-serif; }
        button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 5px; color: #fff; background: var(--accent); cursor: pointer; font: 700 14px Arial, sans-serif; }
        button:hover { background: var(--accent-dark); }
        .status { min-height: 20px; margin: 0 0 20px; color: var(--muted); font: 13px Arial, sans-serif; }
        .status.error { color: #a84025; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        section { padding: 24px; }
        section h2 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin: 0 0 18px; font-size: 25px; font-weight: 500; }
        section h2 span { color: var(--accent-dark); font: 700 12px Arial, sans-serif; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .actions button { flex: 1 1 120px; }
        .name-row { display: flex; gap: 10px; margin-bottom: 16px; }
        pre { min-height: 112px; max-height: 250px; overflow: auto; margin: 0; padding: 15px; color: #30483d; background: #eef5ef; border-left: 3px solid var(--mint); font: 13px/1.6 Consolas, monospace; white-space: pre-wrap; }
        .wide { grid-column: 1 / -1; }
        @media (max-width: 700px) {
            main { width: min(100% - 24px, 560px); padding: 30px 0 48px; }
            header, .toolbar, .name-row { align-items: stretch; flex-direction: column; }
            .intro { max-width: none; }
            .grid { grid-template-columns: 1fr; }
            .wide { grid-column: auto; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <p class="eyebrow">Cloudflare Workers / API console</p>
            <h1>今日の学びを、<br>軽やかに。</h1>
        </div>
        <p class="intro">PagesからWorkerへ接続し、4つのAPIをひとつの画面で確認できます。</p>
    </header>

    <form class="toolbar" id="settings-form">
        <label for="base-url">Worker URL</label>
        <input id="base-url" type="url" value="https://it11-nakamura-workerss.nhs60505.workers.dev" placeholder="https://your-worker.workers.dev" required>
        <button type="submit">接続先を保存</button>
    </form>
    <p class="status" id="status" role="status">接続先を確認してください。</p>

    <div class="grid">
        <section>
            <h2>コース <span>GET /api/course</span></h2>
            <div class="actions"><button data-endpoint="course">コースを取得</button></div>
            <pre id="course-result">まだ取得していません。</pre>
        </section>
        <section>
            <h2>メッセージ <span>GET /api/hello</span></h2>
            <div class="name-row"><input id="name" type="text" maxlength="40" placeholder="名前を入力" aria-label="名前"><button id="hello-button" type="button">挨拶する</button></div>
            <pre id="hello-result">名前を入力して実行してください。</pre>
        </section>
        <section>
            <h2>今日の運勢 <span>GET /api/fortune</span></h2>
            <div class="actions"><button data-endpoint="fortune">運勢を見る</button></div>
            <pre id="fortune-result">まだ取得していません。</pre>
        </section>
        <section>
            <h2>イベント <span>GET /api/events</span></h2>
            <div class="actions"><button data-endpoint="events">イベントを取得</button></div>
            <pre id="events-result">まだ取得していません。</pre>
        </section>
        <section class="wide">
            <h2>API情報 <span>GET /api</span></h2>
            <div class="actions"><button data-endpoint="">API情報を取得</button></div>
            <pre id="api-result">まだ取得していません。</pre>
        </section>
    </div>
</main>
<script>
    const baseUrlInput = document.querySelector('#base-url');
    const status = document.querySelector('#status');
    const productionUrl = 'https://it11-nakamura-workerss.nhs60505.workers.dev';
    const savedUrl = localStorage.getItem('worker-base-url');
    if (savedUrl && !savedUrl.includes('127.0.0.1:8787')) baseUrlInput.value = savedUrl;
    else localStorage.setItem('worker-base-url', productionUrl);

    function apiUrl(path) {
        return `${baseUrlInput.value.replace(/\/$/, '')}/api${path ? `/${path}` : ''}`;
    }

    async function request(path, outputId) {
        const output = document.querySelector(`#${outputId}`);
        output.textContent = '取得中...';
        status.className = 'status';
        try {
            const response = await fetch(apiUrl(path));
            const data = await response.json();
            output.textContent = JSON.stringify(data, null, 2);
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            status.textContent = `${path ? `/api/${path}` : '/api'} に接続しました。`;
        } catch (error) {
            output.textContent = JSON.stringify({ error: error.message }, null, 2);
            status.textContent = `接続に失敗しました: ${error.message}`;
            status.className = 'status error';
        }
    }

    document.querySelector('#settings-form').addEventListener('submit', (event) => {
        event.preventDefault();
        localStorage.setItem('worker-base-url', baseUrlInput.value.replace(/\/$/, ''));
        status.textContent = '接続先を保存しました。';
    });
    document.querySelectorAll('[data-endpoint]').forEach((button) => {
        button.addEventListener('click', () => request(button.dataset.endpoint, `${button.dataset.endpoint || 'api'}-result`));
    });
    document.querySelector('#hello-button').addEventListener('click', () => {
        const name = document.querySelector('#name').value.trim();
        request(`hello?name=${encodeURIComponent(name)}`, 'hello-result');
    });
</script>
</body>
</html>
