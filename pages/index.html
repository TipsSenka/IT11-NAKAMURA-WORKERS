<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cloudflare Workers APIの動作確認用ページ">
    <title>Senka API Console</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172127;
            --muted: #637078;
            --line: #d8e0dc;
            --paper: #f4f8f7;
            --panel: #ffffff;
            --accent: #6c9f94;
            --accent-dark: #4d7d74;
            --accent-light: #e3f0ed;
            --yellow-light: #fff6dc;
            --line: #d9e6e2;
            --shadow: 0 12px 28px rgb(32 55 43 / 7%);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-width: 320px;
            color: var(--ink);
            background: var(--paper);
            font-family: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
        }

        main { width: min(1080px, calc(100% - 64px)); margin: 0 auto; padding: 68px 0 88px; }
        header { display: flex; justify-content: space-between; gap: 48px; align-items: end; margin-bottom: 48px; }
        .eyebrow { margin: 0 0 10px; color: var(--accent-dark); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 0; text-transform: uppercase; }
        h1 { max-width: 610px; margin: 0; font-size: clamp(38px, 7vw, 72px); font-weight: 500; line-height: .98; letter-spacing: 0; }
        .intro { max-width: 270px; margin: 0; color: var(--muted); font: 15px/1.7 Arial, sans-serif; }
        .toolbar, section { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
        .toolbar { padding: 32px 36px; margin-bottom: 36px; }
        .toolbar h2, .log-panel h2 { margin: 0 0 24px; font-size: 25px; font-weight: 500; }
        .url-row { display: flex; gap: 12px; align-items: center; }
        label { color: var(--muted); font: 700 12px/1.2 Arial, sans-serif; white-space: nowrap; }
        input { width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: #fff; font: 14px Arial, sans-serif; }
        input:focus { outline: 3px solid var(--accent-light); border-color: var(--accent); }
        button { min-height: 44px; padding: 0 18px; border: 1px solid var(--accent); border-radius: 5px; color: #315e56; background: var(--accent-light); cursor: pointer; font: 700 14px Arial, sans-serif; }
        button:hover { background: var(--accent-dark); }
        .status { min-height: 20px; margin: 20px 0 0; color: var(--muted); font: 13px Arial, sans-serif; }
        .status.error { color: #a45e50; }
        .actions { display: grid; grid-template-columns: repeat(5, minmax(110px, 1fr)); gap: 14px; margin-top: 24px; }
        .actions button { width: 100%; }
        .name-row { display: flex; gap: 14px; margin-top: 28px; }
        .name-row input { max-width: 320px; }
        .log-panel { padding: 32px 36px 36px; }
        .log-panel h2 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
        .log-panel h2 span { color: var(--muted); font: 700 12px Arial, sans-serif; }
        pre { min-height: 300px; max-height: 460px; overflow: auto; margin: 0; padding: 22px; color: #35554d; background: #f1f7f5; border: 1px solid var(--line); border-radius: 4px; font: 13px/1.6 Consolas, monospace; white-space: pre-wrap; }
        @media (max-width: 700px) {
            main { width: min(100% - 32px, 560px); padding: 40px 0 56px; }
            header, .url-row, .name-row { align-items: stretch; flex-direction: column; }
            header { gap: 24px; margin-bottom: 32px; }
            .toolbar, .log-panel { padding: 24px; }
            .intro { max-width: none; }
            .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .name-row input { max-width: none; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <p class="eyebrow">Cloudflare Workers / API console</p>
            <h1>今日の学びを、<br>軽やかに。</h1>
        </div>
        <p class="intro">PagesからWorkerへ接続し、4つのAPIをひとつの画面で確認できます。</p>
    </header>

    <section class="toolbar">
        <h2>操作パネル</h2>
        <div class="url-row">
            <label for="base-url">Worker URL</label>
            <input id="base-url" type="url" value="https://it11-nakamura-workerss.nhs60505.workers.dev" placeholder="https://your-worker.workers.dev" required>
            <button id="save-url" type="button">接続先を保存</button>
        </div>
        <div class="actions">
            <button data-endpoint="">API情報</button>
            <button data-endpoint="course">コース</button>
            <button data-endpoint="fortune">運勢</button>
            <button data-endpoint="events">イベント</button>
            <button id="clear-log" type="button">ログを消去</button>
        </div>
        <div class="name-row">
            <input id="name" type="text" maxlength="40" placeholder="挨拶する名前を入力" aria-label="名前">
            <button id="hello-button" type="button">挨拶を取得</button>
        </div>
        <p class="status" id="status" role="status">接続先を確認してください。</p>
    </section>

    <section class="log-panel">
        <h2>実行ログ <span>APIレスポンスをここに表示します</span></h2>
        <pre id="log">まだ実行していません。</pre>
    </section>
</main>
<script>
    const baseUrlInput = document.querySelector('#base-url');
    const status = document.querySelector('#status');
    const productionUrl = 'https://it11-nakamura-workerss.nhs60505.workers.dev';
    const savedUrl = localStorage.getItem('worker-base-url');
    if (savedUrl && !savedUrl.includes('127.0.0.1:8787')) baseUrlInput.value = savedUrl;
    else localStorage.setItem('worker-base-url', productionUrl);

    function apiUrl(path) {
        return `${baseUrlInput.value.replace(/\/$/, '')}/api${path ? `/${path}` : ''}`;
    }

    async function request(path) {
        const output = document.querySelector('#log');
        output.textContent = '取得中...';
        status.className = 'status';
        try {
            const response = await fetch(apiUrl(path));
            const data = await response.json();
            output.textContent = `${path ? `/api/${path}` : '/api'}\n\n${JSON.stringify(data, null, 2)}`;
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            status.textContent = `${path ? `/api/${path}` : '/api'} に接続しました。`;
        } catch (error) {
            output.textContent = `${path ? `/api/${path}` : '/api'}\n\n${JSON.stringify({ error: error.message }, null, 2)}`;
            status.textContent = `接続に失敗しました: ${error.message}`;
            status.className = 'status error';
        }
    }

    document.querySelector('#save-url').addEventListener('click', () => {
        localStorage.setItem('worker-base-url', baseUrlInput.value.replace(/\/$/, ''));
        status.textContent = '接続先を保存しました。';
    });
    document.querySelectorAll('[data-endpoint]').forEach((button) => {
        button.addEventListener('click', () => request(button.dataset.endpoint));
    });
    document.querySelector('#hello-button').addEventListener('click', () => {
        const name = document.querySelector('#name').value.trim();
        request(`hello?name=${encodeURIComponent(name)}`);
    });
    document.querySelector('#clear-log').addEventListener('click', () => {
        document.querySelector('#log').textContent = 'まだ実行していません。';
        status.textContent = 'ログを消去しました。';
    });
</script>
</body>
</html>
